version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: health_ai_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-health_ai_db}
      MYSQL_USER: ${DB_USER:-health_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-health_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: health_ai_backend
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-this}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-health_ai_db}
      DB_USER: ${DB_USER:-health_user}
      DB_PASSWORD: ${DB_PASSWORD:-health_password}
      DB_HOST: db
      DB_PORT: 3306
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - media_files:/app/media
      - ./ml_data:/app/ml_data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn health_ai.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api}
    container_name: health_ai_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  mysql_data:
  media_files:
